spring.application.name=BaiTap-RS
server.port=${SERVER_PORT:8081}

app.logging.directory=${APP_LOG_DIRECTORY:build/logs}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/java_coban}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
