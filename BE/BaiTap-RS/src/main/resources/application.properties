spring.application.name=BaiTap-RS
server.port=${SERVER_PORT:8081}

app.logging.directory=${APP_LOG_DIRECTORY:build/logs}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/java_coban}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.seed.demo.enabled=${APP_SEED_DEMO_ENABLED:false}

app.jwt.secret=${JWT_SECRET:noVGO4KXfRQijWLkkHTdwMZzJcsvohOLNTzXHkWOEOwwj50/QWunAGce8b6XKqUwss6ozCb5A/e++2SPZN/d2Q==}
app.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:864000}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=2000
spring.data.web.pageable.one-indexed-parameters=true

management.endpoints.web.exposure.include=health,info,metrics

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:kduy1706@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
