services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: java_coban
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy docker/.env.example to docker/.env and set MYSQL_ROOT_PASSWORD.}
    ports:
      - "3307:3306"
    volumes:
      - java-coban-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./BE/BaiTap-RS
      dockerfile: Dockerfile
    image: ${API_IMAGE_NAME:-java-coban-api:local}
    environment:
      SERVER_PORT: "8081"
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: java_coban
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/java_coban
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy docker/.env.example to docker/.env and set MYSQL_ROOT_PASSWORD.}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # OpenAI-compatible provider settings (for example, a 9Router endpoint).
      # Keep the actual key in the untracked docker/.env file; never bake it into the image.
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:?Set the OpenAI-compatible API base URL.}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:?Set the provider API key in docker/.env.}
      SPRING_AI_OPENAI_CHAT_MODEL: ${SPRING_AI_OPENAI_CHAT_MODEL:?Set a model identifier supported by your 9Router account.}
      APP_AI_TIMETABLE_ENABLED: ${APP_AI_TIMETABLE_ENABLED:-false}
      APP_AI_TIMETABLE_MAX_CLASS_COUNT: ${APP_AI_TIMETABLE_MAX_CLASS_COUNT:-0}
      APP_AI_TIMETABLE_MAX_CONTEXT_CHARACTERS: ${APP_AI_TIMETABLE_MAX_CONTEXT_CHARACTERS:-0}
      APP_AI_TIMETABLE_MAX_REQUEST_CHARACTERS: ${APP_AI_TIMETABLE_MAX_REQUEST_CHARACTERS:-0}
      APP_AI_TIMETABLE_MAX_PREFERENCES_CHARACTERS: ${APP_AI_TIMETABLE_MAX_PREFERENCES_CHARACTERS:-0}
      APP_AI_TIMETABLE_MAX_PROPOSAL_ENTRIES: ${APP_AI_TIMETABLE_MAX_PROPOSAL_ENTRIES:-0}
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  test-data:
    image: postman/newman:6-alpine
    profiles: ["tools"]
    volumes:
      - ./document/postman/Java-CoBan-Batch-Test-Data.postman_collection.json:/etc/newman/Java-CoBan-Batch-Test-Data.postman_collection.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  java-coban-mysql-data:
