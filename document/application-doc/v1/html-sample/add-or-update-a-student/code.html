<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduManage - Create/Edit Student</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "tertiary-container": "#a54100",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#ffd2c0",
                        "on-tertiary-fixed": "#351000",
                        "surface-container": "#eceef0",
                        "secondary-fixed": "#d3e4fe",
                        "surface-dim": "#d8dadc",
                        "on-tertiary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",
                        "surface-tint": "#4d44e4",
                        "secondary-container": "#d0e1fb",
                        "secondary": "#505f76",
                        "on-surface-variant": "#464555",
                        "outline": "#777587",
                        "primary-fixed": "#e2dfff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#f7f9fb",
                        "on-secondary-container": "#54647a",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#0b1c30",
                        "primary": "#3525ce",
                        "tertiary": "#7e3000",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed-dim": "#ffb695",
                        "primary-container": "#4f46e6",
                        "primary-fixed-dim": "#c3c0ff",
                        "inverse-primary": "#c3c0ff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-fixed": "#ffdbcc",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3322cd",
                        "on-primary-container": "#dbd8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "sidebar-width": "260px",
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-sm": ["Inter"],

                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }

<style>
        body { background-color: #F8FAFC; } /* Explicit level 0 background */
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full h-16 flex justify-between items-center px-margin-desktop z-50 bg-surface-container-lowest dark:bg-inverse-surface text-primary dark:text-inverse-primary border-b border-outline-variant dark:border-outline font-body-md text-body-md flat no shadows">
<div class="flex items-center gap-4">
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-inverse-primary">EduManage</span>
</div>
<div class="flex items-center gap-6">
<span class="text-on-surface font-label-md text-label-md">Welcome, Admin</span>
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">logout</span> Logout
            </button>
</div>
</header>
<!-- SideNavBar (Suppressed due to form view/focused task logic) -->
<!-- Content Area (Full width due to suppressed sidebar, centered container) -->
<main class="pt-[96px] pb-12 px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto flex justify-center">
<div class="w-full max-w-4xl">
<!-- Header Section -->
<div class="flex items-center gap-4 mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Create/Edit Student</h1>
<p class="font-body-sm text-body-sm text-secondary mt-1">Manage student personal information and academic standing.</p>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-6 md:p-8">
<form class="space-y-8">
<!-- Hidden Student ID -->
<input name="student_id" type="hidden" value="12345"/>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
<!-- Student Code Group -->
<div class="space-y-2 col-span-1">
<label class="block font-label-md text-label-md text-on-surface">Student Code</label>
<div class="flex gap-2">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface font-body-md text-body-md focus:outline-none cursor-not-allowed opacity-80" placeholder="Generated automatically" readonly="" type="text" value="STU-2024-001"/>
<button class="px-4 py-2.5 bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors whitespace-nowrap" type="button">
                                    Generate
                                </button>
</div>
</div>
<!-- Spacer for grid alignment -->
<div class="hidden md:block col-span-1"></div>
<!-- Student Name -->
<div class="space-y-2 col-span-1">
<label class="block font-label-md text-label-md text-on-surface" for="student_name">Student Name <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="student_name" placeholder="Enter full name" type="text" value="Jane Doe"/>
</div>
<!-- Birthday -->
<div class="space-y-2 col-span-1">
<label class="block font-label-md text-label-md text-on-surface" for="birthday">Date of Birth</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="birthday" type="date" value="2005-04-12"/>
</div>
</div>
<!-- Address -->
<div class="space-y-2 col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface" for="address">Address</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-none" id="address" placeholder="Enter full residential address" rows="3">123 Education Lane, Learning City, ED 90210</textarea>
</div>
<!-- Average Score -->
<div class="space-y-2 col-span-1">
<label class="block font-label-md text-label-md text-on-surface" for="avg_score">Average Score</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="avg_score" max="100" min="0" placeholder="0.0 - 100.0" step="0.1" type="number" value="88.5"/>
</div>
</div>
<!-- Divider -->
<hr class="border-outline-variant my-8"/>
<!-- Actions -->
<div class="flex justify-end gap-4">
<button class="px-6 py-2.5 bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors" type="button">
                            Cancel
                        </button>
<button class="px-6 py-2.5 bg-primary-container text-on-primary-container rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity shadow-sm flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span> Save Student
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>
