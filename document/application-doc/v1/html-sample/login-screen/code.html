<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduManage - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e6e8ea",
                    "inverse-surface": "#2d3133",

                    "inverse-on-surface": "#eff1f3",
                    "on-surface": "#191c1e",
                    "surface-variant": "#e0e3e5",
                    "error": "#ba1a1a",
                    "tertiary-container": "#a54100",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary-container": "#ffd2c0",
                    "on-tertiary-fixed": "#351000",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#d3e4fe",
                    "surface-dim": "#d8dadc",
                    "on-tertiary": "#ffffff",
                    "on-background": "#191c1e",
                    "surface-bright": "#f7f9fb",
                    "surface-tint": "#4d44e4",
                    "secondary-container": "#d0e1fb",
                    "secondary": "#505f76",
                    "on-surface-variant": "#464555",
                    "outline": "#777587",
                    "primary-fixed": "#e2dfff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#0f0069",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#b7c8e1",
                    "background": "#f7f9fb",
                    "on-secondary-container": "#54647a",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#0b1c30",
                    "primary": "#3525ce",
                    "tertiary": "#7e3000",
                    "outline-variant": "#c7c4d8",
                    "tertiary-fixed-dim": "#ffb695",
                    "primary-container": "#4f46e6",
                    "primary-fixed-dim": "#c3c0ff",
                    "inverse-primary": "#c3c0ff",
                    "on-tertiary-fixed-variant": "#7b2f00",
                    "surface": "#f7f9fb",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "tertiary-fixed": "#ffdbcc",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#3322cd",
                    "on-primary-container": "#dbd8ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "sidebar-width": "260px",
                    "margin-mobile": "16px",
                    "unit": "4px",
                    "container-max": "1280px",
                    "margin-desktop": "32px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

            }
          },
        }

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-background flex flex-col justify-center items-center px-margin-mobile md:px-0">
<!-- The Nav Shell is suppressed for Linear/Transactional Login screens as per rule -->
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-[32px] flex flex-col items-center">
<!-- Header Section -->
<div class="flex flex-col items-center mb-[32px] w-full text-center border-b border-outline-variant pb-[16px]">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-primary font-headline-md" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">EduManage</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Admin Portal Login</p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="username">User Name</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-10 pl-10 pr-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-10 pl-10 pr-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full h-10 mt-4 bg-primary-container text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 transition-opacity active:scale-[0.98]" type="button">
                Login
            </button>
</form>
<!-- Footer Section -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline" href="#">Register</a>
</p>
</div>
</main>
</body></html>
