<body class="h-full font-body-md text-on-surface bg-background flex items-center justify-center p-4">
<!-- Register Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant rounded-lg p-8 shadow-sm">
<!-- Header -->
<div class="mb-8 text-center">
<h1 class="font-display-lg text-display-lg text-primary mb-2">EduManage</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">Register</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Create an account to manage your institution.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- User Name Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="username">User Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-shadow" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="confirm-password">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-shadow" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors h-[40px]" type="submit">
                    Register
                </button>
<a class="w-full flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg shadow-sm font-label-md text-label-md text-on-surface bg-surface-container-lowest hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors h-[40px]" href="#">
                    Back
                </a>
</div>
</form>
<!-- Graphic Element (Subtle Background Image) -->
<div class="mt-8 relative h-32 rounded-lg overflow-hidden border border-outline-variant" data-alt="A subtle, minimalist vector illustration representing education and growth. It features soft, abstract geometric shapes like overlapping circles and triangles in light blue and indigo tones, set against a crisp white background. The style is modern corporate, flat design, high legibility, conveying a sense of institutional reliability and clarity without being distracting. Light mode aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDunK78J8pd0-JFP7a4QdG2bV9HBLLd4wrHtUft0YvIux5920seO2QwG_hyWUFnNkkhsfqDLk6BdNMNYdxp5gRNlazqyYrg9MPQfFhG4bIWceDYySqwGtIjnfhlGQ1LPb4Q_Y8XhV0Fx8CnU_E0bQmaRwtL7psihfmhzQvO8mBMYUT7sXbw3DLG9PVIbofQYVbvFobfCetMdBvkf2ATEzTAL-ub0HGsVstqcU-DUGtOTZbzRGKNKBZD')">
